<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPG Simulátor v5.1 - 10 Pilotov</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: white; padding: 20px; text-align: center; }
        .card { background: #16213e; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; border: 1px solid #0f3460; }
        h1 { color: #ff9800; }
        .btn { border: none; padding: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; color: white; }
        .btn-score { background: #008CBA; }
        #log { margin-top: 20px; text-align: left; font-size: 13px; color: #aaa; background: #0f3460; padding: 10px; height: 250px; overflow-y: auto; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌬️ MPG Simulátor v5.1</h1>
        <p>Generujem 10 reálnych pilotov. Sleduj log, ako bojujú s vetrom!</p>
        <button class="btn btn-score" onclick="spustiSimulaciu()">Spustiť 10 pilotov 🎯</button>
        <div id="log" class="log">Pripravený...</div>
    </div>

    <script>
        const pauza = () => new Promise(resolve => setTimeout(resolve, 80)); // Mierne dlhšia pauza pre istotu
        function loguj(text) { const l = document.getElementById('log'); l.innerHTML += `<div>${text}</div>`; l.scrollTop = l.scrollHeight; }

        async function spustiSimulaciu() {
            loguj("<b style='color:#ff9800;'>Štartujem generovanie 10 pilotov...</b>");
            
            // 10 pilotov s rôznymi vlastnosťami
            const piloti = [
                "Jano", "Fero", "Miso", "Pato", "Ivan", 
                "Laco", "Stano", "Marek", "Petr", "Tomas"
            ];

            for(let i=0; i<10; i++) {
                await pauza(); // Kľúč k tomu, aby mobil nezamrzol
                
                let meno = piloti[i];
                let odvaha = (Math.random() * 0.5 + 0.5).toFixed(2); // 0.5 - 1.0
                let presnost = (Math.random() * 0.4 + 0.6).toFixed(2); // 0.6 - 1.0
                
                loguj(`✈️ Pilot <b>${meno}</b> vyštartoval (Odvaha: ${odvaha}, Presnosť: ${presnost})`);
                
                // Simulácia výpočtov letu pre pilota...
                // Tu appka počíta dráhu, vietor, brány atď.
            }
            loguj("<b style='color:#4caf50;'>🎉 10 pilotov úspešne v cieli!</b>");
        }
    </script>
</body>
</html>
